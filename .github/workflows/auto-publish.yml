name: Auto Publish Articles

on:
  schedule:
    # 費用を抑えるため1日1回。米国の試合が終わった後の JST 18:00 に実行
    - cron: '0 9 * * *'   # JST 18:00（UTC 09:00）
  workflow_dispatch:

permissions:
  contents: write  # 定期実行を止めないための空コミットを push する

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run daily pipeline
        run: npx tsx scripts/daily-pipeline.ts
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BALLDONTLIE_API_KEY: ${{ secrets.BALLDONTLIE_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      # GitHub は60日間コミットのないリポジトリの定期実行を自動で止めるため、
      # 最後のコミットから30日以上たっていたら空コミットを1つ積んで止まらないようにする。
      # パイプラインが失敗した日も実行する（失敗が続いても定期実行自体は止めない）
      - name: Keep scheduled workflow active
        if: always()
        run: |
          last=$(git log -1 --format=%ct)
          days=$(( ($(date +%s) - last) / 86400 ))
          echo "最後のコミットから ${days} 日"
          if [ "$days" -ge 30 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Chore: keep scheduled workflow active"
            git push
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: publish-logs
          path: logs/
          retention-days: 30
