name: "図版: 作品型の図のデータ（試合経過の集計）"

# 今季の全試合の試合経過データ（ESPN）を集計し、作品型の図のデータを data/viz/ に保存する（scoring-clock.json / decided-at.json）。
# 起動のされ方:
#   - 毎日（朝会の前。前夜の試合を足す）
#   - 手動（Actions 画面から）
#   - 集計スクリプトを変えた push（試作・改修の確認用）
on:
  schedule:
    - cron: '30 8 * * *' # JST 17:30
  workflow_dispatch:
  push:
    paths:
      - 'scripts/viz/fetch-play-by-play.ts'
      - '.github/workflows/viz-play-by-play.yml'
      - '.gitignore' # data/viz/ をコミットできるかどうかを左右する

permissions:
  contents: write

concurrency:
  group: viz-play-by-play-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - run: npm ci

      - name: 🕐 試合経過を集計（時計図・試合はいつ決まるか）
        run: npx tsx scripts/viz/fetch-play-by-play.ts

      - name: 集計結果をコミット
        run: |
          if [ -n "$(git status --porcelain data/viz/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/viz/
            git commit -m "図版: 時計図のデータを更新"
            git push
          else
            echo "変更なし"
          fi
